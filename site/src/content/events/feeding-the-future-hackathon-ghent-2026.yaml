notes: "Eventbrite page opened 20 Nov 2026. Two separate days, both obligatory: 'DAY 1 - Monday 30
  November, ILVO, Melle' and 'DAY 2 - Friday 4 December, School Keerpunt, Ghent', so the event is
  not five days long; end_date is the second day. No year on the page; 2026 is taken from the
  weekdays and from the event showing as upcoming in Eventbrite's listing. Participants meet at
  School Keerpunt, Campus Bijloke, on day 1 and go to ILVO by bus. 40 participants, free, Dutch and
  English. Day 2 ends with a public two-minute pitch competition before a jury of three, trophies
  for the top three. The page says it is for 'girls aged 14 to 19'; the 'Who can join?' FAQ answer
  could not be read. audience is set to students for lack of a closer value."
