notes:
  "From simpl-programme.ec.europa.eu/events/hackathon, opened 18 Nov 2026: 9 December 2026, 'will
  take place in Brussels', remote participation 'may be considered', open to all participants with
  no prior experience needed, organisations may join as teams. Registration is by e-mail to the
  programme with the subject 'Hackathon Registration'; no deadline and no times given. Three steps
  (explore, install, improve), findings shared through GitLab. Venue left out: the page names none;
  a search snippet mentioned 'Coudenberg Entrance' but no opened page confirms it. The Commission
  newsroom item (ec.europa.eu/newsroom/simpl, item 959756) says 9 December 2026 in its text but its
  date field reads 09/10/2026. The 3rd Simpl Annual Community Event follows on 10 December 2026 in
  Brussels with separate registration. Language not stated; EN assumed from the page. Re-checked
  26 Nov 2026: the page still gives 9 December 2026 in Brussels, no venue and no change notice.
  Re-checked 28 Nov 2026: the page now has an 'At a glance' block with 'Rue de la Loi 51, 1040
  Brussels, Belgium', '9 December 2026, 10:00 - 18:00 CET' and 'Open to all participants'; access
  to the Commission premises needs prior registration (by e-mail), remote participation is not
  foreseen. venue was added. No change notice."
