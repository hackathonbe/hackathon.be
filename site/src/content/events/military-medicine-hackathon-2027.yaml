notes:
  Found on the Inno4Def events page (listed as 'MMH'), then opened inno4def.be/mmh/ on 2026-11-11.
  Open to Belgian Defence medical staff, civilian clinicians, MedTech and drone companies, software
  and communications engineers, researchers and students; each team member registers individually.
  Run under Inno4Def by a consortium of Verhaert, Hack Belgium Labs and Sopra Steria. No place is
  given, so city is left out and region 'nationwide' is only a placeholder. Language not stated; EN
  assumed from the page text. On the Inno4Def overview page the MMH entry carries the Battlefield of
  Things 3 description, which looks like a copy error on their side.
